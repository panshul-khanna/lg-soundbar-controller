<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundbar Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #17171a;
      --panel: #1f2023;
      --strip: #26272b;
      --strip-edge: #313236;
      --text: #e9e7e1;
      --text-dim: #8b8c90;
      --led: #5dffa0;
      --led-dim: #26533b;
      --warn: #ff8a4c;
      --track: #0f0f11;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 20% 0%, rgba(93, 255, 160, 0.04), transparent 40%),
        radial-gradient(circle at 80% 100%, rgba(255, 138, 76, 0.03), transparent 40%);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 60px;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--strip-edge);
      padding-bottom: 14px;
    }

    h1 {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-size: 22px;
      margin: 0;
      text-transform: uppercase;
    }

    h1 span {
      color: var(--led);
    }

    #status {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    #status.live {
      color: var(--led);
    }

    .console {
      display: flex;
      gap: 14px;
      background: var(--panel);
      border: 1px solid var(--strip-edge);
      border-radius: 6px;
      padding: 24px 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .strip {
      width: 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--strip);
      border: 1px solid var(--strip-edge);
      border-radius: 4px;
      padding: 14px 8px 18px;
    }

    .strip.master {
      border-color: var(--led-dim);
    }

    .strip-label {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .strip.master .strip-label {
      color: var(--led);
    }

    .readout {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 10px;
      min-width: 40px;
      text-align: center;
      background: var(--track);
      border-radius: 3px;
      padding: 2px 0;
    }

    .fader-track {
      position: relative;
      width: 40px;
      height: 220px;
      background: var(--track);
      border-radius: 4px;
      display: flex;
      justify-content: center;
      overflow: visible;
    }

    .fader-track .ticks {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 6px;
      right: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    .fader-track .ticks span {
      width: 100%;
      border-top: 1px solid #33343a;
    }

    input[type=range].vfader {
      -webkit-appearance: none;
      appearance: none;
      width: 220px;
      height: 40px;
      background: transparent;
      transform: rotate(-90deg);
      position: absolute;
      top: 90px;
      left: -90px;
      margin: 0;
    }

    input[type=range].vfader::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
    }

    input[type=range].vfader::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 40px;
      border-radius: 3px;
      background: linear-gradient(#3a3b40, #202124);
      border: 1px solid #4a4b52;
      border-top: 2px solid var(--led);
      margin-top: -18px;
      cursor: grab;
    }

    input[type=range].vfader:active::-webkit-slider-thumb {
      cursor: grabbing;
    }

    input[type=range].vfader::-moz-range-thumb {
      width: 20px;
      height: 40px;
      border-radius: 3px;
      background: linear-gradient(#3a3b40, #202124);
      border: 1px solid #4a4b52;
      border-top: 2px solid var(--led);
      cursor: grab;
    }

    .toggle {
      margin-top: 14px;
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      background: var(--track);
      border: 1px solid var(--strip-edge);
      border-radius: 3px;
      padding: 5px 8px;
      cursor: pointer;
      width: 100%;
    }

    .toggle.on {
      color: var(--bg);
      background: var(--led);
      border-color: var(--led);
    }

    .toggle.warn.on {
      background: var(--warn);
      border-color: var(--warn);
    }

    footer {
      margin-top: 20px;
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      gap: 16px;
      align-items: center;
    }

    footer button {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      background: var(--strip);
      border: 1px solid var(--strip-edge);
      border-radius: 3px;
      padding: 6px 12px;
      cursor: pointer;
    }

    footer button:hover {
      color: var(--text);
    }
  </style>
</head>

<body>

  <header>
    <h1>Soundbar <span>Controller</span></h1>
    <div id="status">connecting&hellip;</div>
  </header>

  <div class="console">
    <div class="strip" data-channel="master">
      <div class="strip-label">Front / Master</div>
      <div class="readout" id="readout-master">--</div>
      <div class="fader-track">
        <div class="ticks"><span></span><span></span><span></span><span></span><span></span></div>
        <input type="range" class="vfader" id="fader-master" min="0" max="100" step="1" value="50">
      </div>
      <button class="toggle warn" id="mute-btn">Mute</button>
    </div>

    <div class="strip" data-channel="center">
      <div class="strip-label">Center</div>
      <div class="readout" id="readout-center">--</div>
      <div class="fader-track">
        <div class="ticks"><span></span><span></span><span></span><span></span><span></span></div>
        <input type="range" class="vfader" id="fader-center" min="-6" max="6" step="1" value="0">
      </div>
    </div>

    <div class="strip" data-channel="dialog">
      <div class="strip-label">Dialogue</div>
      <div class="readout" id="readout-dialog">--</div>
      <div class="fader-track">
        <div class="ticks"><span></span><span></span><span></span><span></span><span></span></div>
        <input type="range" class="vfader" id="fader-dialog" min="0" max="6" step="1" value="0">
      </div>
    </div>

    <div class="strip" data-channel="subwoofer">
      <div class="strip-label">Subwoofer</div>
      <div class="readout" id="readout-subwoofer">--</div>
      <div class="fader-track">
        <div class="ticks"><span></span><span></span><span></span><span></span><span></span></div>
        <input type="range" class="vfader" id="fader-subwoofer" min="-15" max="6" step="1" value="0">
      </div>
    </div>

    <div class="strip" data-channel="rear">
      <div class="strip-label">Rear</div>
      <div class="readout" id="readout-rear">--</div>
      <div class="fader-track">
        <div class="ticks"><span></span><span></span><span></span><span></span><span></span></div>
        <input type="range" class="vfader" id="fader-rear" min="-6" max="6" step="1" value="0">
      </div>
      <button class="toggle" id="rear-enable-btn">Rear On</button>
    </div>

    <div class="strip" data-channel="top">
      <div class="strip-label">Height / Top</div>
      <div class="readout" id="readout-top">--</div>
      <div class="fader-track">
        <div class="ticks"><span></span><span></span><span></span><span></span><span></span></div>
        <input type="range" class="vfader" id="fader-top" min="-6" max="6" step="1" value="0">
      </div>
    </div>
  </div>

  <footer>
    <span id="footnote">Live-synced with LG ThinQ. Ranges match your device's own reported min/max exactly.</span>
  </footer>

  <script>
    const channels = ["master", "center", "dialog", "subwoofer", "rear", "top"];
    let muted = false;
    let rearEnabled = true;
    const dragging = {};

    function setStatus(text, live) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.className = live ? "live" : "";
    }

    function readoutText(channel, value) {
      if (channel === "master") return value;
      if (value > 0) return "+" + value;
      return value;
    }

    function applyState(data) {
      channels.forEach((channel) => {
        if (dragging[channel]) return; // don't fight the user's active drag
        const key = channel === "master" ? "master_volume" : channel + "_level";
        const slider = document.getElementById("fader-" + channel);
        // Size the slider to the device's own reported range for this channel.
        const minKey = channel + "_min";
        const maxKey = channel + "_max";
        if (data[minKey] !== null && data[minKey] !== undefined) {
          slider.min = data[minKey];
        }
        if (data[maxKey] !== null && data[maxKey] !== undefined) {
          slider.max = data[maxKey];
        }
        const val = data[key];
        if (val !== null && val !== undefined) {
          slider.value = val;
        }
        updateReadout(channel);
      });
      if (!dragging.mute) {
        muted = !!data.muted;
        updateMuteBtn();
      }
      if (!dragging.rear_enabled) {
        rearEnabled = data.rear_enabled !== false;
        updateRearBtn();
      }
    }

    function updateReadout(channel) {
      const slider = document.getElementById("fader-" + channel);
      document.getElementById("readout-" + channel).textContent = readoutText(channel, slider.value);
    }

    function updateMuteBtn() {
      const btn = document.getElementById("mute-btn");
      btn.textContent = muted ? "Muted" : "Mute";
      btn.classList.toggle("on", muted);
    }

    function updateRearBtn() {
      const btn = document.getElementById("rear-enable-btn");
      btn.textContent = rearEnabled ? "Rear On" : "Rear Off";
      btn.classList.toggle("on", rearEnabled);
    }

    let sendTimers = {};
    function sendValue(channel, value) {
      clearTimeout(sendTimers[channel]);
      sendTimers[channel] = setTimeout(() => {
        fetch("/api/set/" + channel, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ value: value })
        }).catch(() => setStatus("offline", false));
      }, 60);
    }

    channels.forEach((channel) => {
      const slider = document.getElementById("fader-" + channel);
      slider.addEventListener("pointerdown", () => { dragging[channel] = true; });
      slider.addEventListener("pointerup", () => { dragging[channel] = false; });
      slider.addEventListener("input", () => {
        updateReadout(channel);
        sendValue(channel, slider.value);
      });
    });

    document.getElementById("mute-btn").addEventListener("click", () => {
      dragging.mute = true;
      muted = !muted;
      updateMuteBtn();
      fetch("/api/mute", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enable: muted })
      }).catch(() => setStatus("offline", false))
        .finally(() => { dragging.mute = false; });
    });

    document.getElementById("rear-enable-btn").addEventListener("click", () => {
      dragging.rear_enabled = true;
      rearEnabled = !rearEnabled;
      updateRearBtn();
      fetch("/api/rear-enabled", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enable: rearEnabled })
      }).catch(() => setStatus("offline", false))
        .finally(() => { dragging.rear_enabled = false; });
    });

    // Live push updates -- fires the instant ThinQ, the remote, or this UI
    // changes anything on the soundbar.
    const stream = new EventSource("/api/stream");
    stream.onmessage = (event) => {
      applyState(JSON.parse(event.data));
      setStatus("live \u2014 synced", true);
    };
    stream.onerror = () => setStatus("reconnecting\u2026", false);
  </script>

</body>

</html>
